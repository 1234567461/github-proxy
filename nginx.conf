# =====================================================================
# GitHub 全站反向代理 - nginx 配置（在能直连 github.com 的服务器上使用）
# 监听 8081，把 github.com 及相关子域反代到本地路径前缀。
# 用法：
#   1) 把本文件放到 /etc/nginx/conf.d/github-proxy.conf  (或 sites-available 软链)
#   2) nginx -t && nginx -s reload
#   3) 访问 http://<服务器IP>:8081/
# 注意：nginx 需要 ngx_http_sub_module（默认编译）；proxy_pass https 需要 resolver。
# =====================================================================

# 域名 -> 路径前缀 的替换规则（用于 sub_filter 全文替换）
# 主站 https://github.com -> http://$host  ($host 即访问用的域名/IP:端口)

# resolver：nginx 解析上游域名用（用公共 DNS 即可）
resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

# 上游连接参数
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_connect_timeout 30s;
proxy_read_timeout    300s;
proxy_send_timeout    300s;

# 替换响应体里的 GitHub 绝对 URL（HTML/CSS/JS/JSON 全替换）
sub_filter_types text/html text/css application/javascript application/json text/javascript;
sub_filter_once off;

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # 让上游以为我们就是 github.com，并带上真实客户端信息
    proxy_set_header Host                github.com;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header User-Agent          $http_user_agent;
    # 去掉 referer/origin，避免被当外站
    proxy_set_header Referer             "";
    proxy_set_header Origin              "";
    # 让上游别返回压缩（sub_filter 才能直接替换文本）；nginx 会重新按需压缩
    proxy_set_header Accept-Encoding    "";

    # 重写跳转地址：把 Location 里的 https://github.com 改成走代理
    proxy_redirect https://github.com/           /;
    proxy_redirect https://github.com            $scheme://$host;
    proxy_redirect https://raw.githubusercontent.com/   /__raw__/;
    proxy_redirect https://api.github.com/             /__api__/;
    proxy_redirect https://codeload.github.com/        /__codeload__/;
    proxy_redirect https://github.githubassets.com/    /__assets__/;

    # 删掉会拦截资源加载 / HSTS 的响应头
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-XSS-Protection;

    # ---------- 各子域路由（前缀长的放前面） ----------
    location /__gistassets__/       { proxy_pass https://gist-assets.githubusercontent.com/;  proxy_set_header Host gist-assets.githubusercontent.com; }
    location /__privateuserimages__/ { proxy_pass https://private-user-images.githubusercontent.com/; proxy_set_header Host private-user-images.githubusercontent.com; }
    location /__releases__/         { proxy_pass https://github-releases.githubusercontent.com/; proxy_set_header Host github-releases.githubusercontent.com; }
    location /__userimages__/       { proxy_pass https://user-images.githubusercontent.com/;  proxy_set_header Host user-images.githubusercontent.com; }
    location /__objects__/          { proxy_pass https://objects.githubusercontent.com/;      proxy_set_header Host objects.githubusercontent.com; }
    location /__avatars__/          { proxy_pass https://avatars.githubusercontent.com/;      proxy_set_header Host avatars.githubusercontent.com; }
    location /__raw__/              { proxy_pass https://raw.githubusercontent.com/;          proxy_set_header Host raw.githubusercontent.com; }
    location /__assets__/            { proxy_pass https://github.githubassets.com/;            proxy_set_header Host github.githubassets.com; }
    location /__codeload__/         { proxy_pass https://codeload.github.com/;                proxy_set_header Host codeload.github.com; }
    location /__api__/              { proxy_pass https://api.github.com/;                     proxy_set_header Host api.github.com; }
    location /__docs__/             { proxy_pass https://docs.github.com/;                   proxy_set_header Host docs.github.com; }
    location /__gist__/             { proxy_pass https://gist.github.com/;                    proxy_set_header Host gist.github.com; }
    location /__camo__/             { proxy_pass https://camo.githubusercontent.com/;         proxy_set_header Host camo.githubusercontent.com; }

    # ---------- 主站 github.com（默认 location，放最后） ----------
    # sub_filter：把响应里出现的 GitHub 绝对 URL 改写成走代理
    sub_filter 'https://gist-assets.githubusercontent.com'         '$scheme://$host/__gistassets__';
    sub_filter 'https://private-user-images.githubusercontent.com' '$scheme://$host/__privateuserimages__';
    sub_filter 'https://github-releases.githubusercontent.com'     '$scheme://$host/__releases__';
    sub_filter 'https://user-images.githubusercontent.com'         '$scheme://$host/__userimages__';
    sub_filter 'https://objects.githubusercontent.com'            '$scheme://$host/__objects__';
    sub_filter 'https://avatars.githubusercontent.com'             '$scheme://$host/__avatars__';
    sub_filter 'https://raw.githubusercontent.com'                '$scheme://$host/__raw__';
    sub_filter 'https://github.githubassets.com'                  '$scheme://$host/__assets__';
    sub_filter 'https://codeload.github.com'                      '$scheme://$host/__codeload__';
    sub_filter 'https://api.github.com'                           '$scheme://$host/__api__';
    sub_filter 'https://docs.github.com'                          '$scheme://$host/__docs__';
    sub_filter 'https://gist.github.com'                          '$scheme://$host/__gist__';
    sub_filter 'https://github.com'                               '$scheme://$host';
    sub_filter '//github.com'                                      '//$host';

    location / {
        proxy_pass https://github.com;
        proxy_set_header Host github.com;
    }
}
